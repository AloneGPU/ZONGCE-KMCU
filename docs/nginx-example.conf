# ============================================================
# 大学生综测管理平台 — Nginx 反向代理参考配置
# 适用: 前端静态资源由 Node 托管(Express), Nginx 只做反代 + TLS 终止
# 部署: 放入 /etc/nginx/conf.d/zongce.conf 后 `nginx -t && systemctl reload nginx`
#
# 关键点:
#  - client_max_body_size 必须 >= UPLOAD_MAX_SIZE(默认 10MB), 否则上传被 413 截断
#  - proxy_set_header 透传 X-Forwarded-For / X-Real-IP, 服务端 trust proxy=1 限流按真实 IP
#  - SSE/长连接(如果未来用)在 proxy_http_version 1.1 + Connection "" 配置
# ============================================================

server {
    listen 80;
    server_name zongce.example.edu.cn;
    # 强制 HTTPS(证书配置好后放开下面两个块)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zongce.example.edu.cn;

    ssl_certificate     /etc/nginx/ssl/zongce.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zongce.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传大小限制(与后端 UPLOAD_MAX_SIZE 对齐, 默认 10MB; 调大需同时调后端)
    client_max_body_size 11m;

    # 前端静态资源与 API 全部由 Node 服务(3000 端口)处理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 后端健康检查 / 冒烟脚本走同一入口即可; 如需独立探针可加:
    # location = /api/health {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     access_log off;
    # }
}